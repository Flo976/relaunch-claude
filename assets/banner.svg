<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191817"/>
      <stop offset="1" stop-color="#2B1C16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .spin { transform-origin: 250px 210px; animation: spin 6s cubic-bezier(.6,0,.2,1) infinite; }
      @keyframes spin { 0%, 70% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 250px 210px; }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .9; transform: scale(1.08); } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .t { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .h { font-family: "Inter", "Segoe UI", "Helvetica Neue", Ubuntu, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#grid)"/>
  <circle class="pulse" cx="250" cy="210" r="190" fill="url(#glow)"/>

  <!-- icon -->
  <g transform="translate(130 90)">
    <rect width="240" height="240" rx="56" fill="#1F1E1D" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g class="spin" style="transform-origin: 120px 120px">
      <path d="M188 120a68 68 0 1 1-20-48" fill="none" stroke="#D97757" stroke-width="20" stroke-linecap="round"/>
      <path d="M188 92L180 50L146 84Z" fill="#D97757" stroke="#D97757" stroke-width="6" stroke-linejoin="round"/>
    </g>
    <path d="M88 100l26 20-26 20" fill="none" stroke="#F5F0E8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="cursor" d="M122 148h32" stroke="#F5F0E8" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- text -->
  <text x="450" y="178" class="h" font-size="78" font-weight="800" fill="#F5F0E8" letter-spacing="-2">Relaunch <tspan fill="#D97757">Claude</tspan></text>
  <text x="452" y="232" class="h" font-size="28" fill="#CFC6BA">Your machine rebooted. Your Claude Code sessions didn't notice.</text>

  <g transform="translate(452 272)">
    <rect width="300" height="54" rx="14" fill="#0E0D0C" stroke="#D97757" stroke-opacity="0.5"/>
    <text x="22" y="35" class="t" font-size="24" fill="#8A8178">$</text>
    <text x="48" y="35" class="t" font-size="24" fill="#F5F0E8" font-weight="700">reclaude</text>
    <rect class="cursor" x="172" y="16" width="12" height="24" fill="#D97757"/>
  </g>
  <text x="776" y="306" class="h" font-size="22" fill="#8A8178">or one click on the icon · Ubuntu &amp; Windows</text>
</svg>
